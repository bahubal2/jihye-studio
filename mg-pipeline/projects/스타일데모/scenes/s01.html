<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="cues" content="1-3">
<link rel="stylesheet" href="../../../engine/web/kit.css">
<style>
  @font-face { font-family: 'GM'; src: url('../../../fonts/GmarketSansTTFBold.ttf'); }
  @font-face { font-family: 'GMm'; src: url('../../../fonts/GmarketSansTTFMedium.ttf'); }
  @font-face { font-family: 'BH'; src: url('../../../fonts/BlackHanSans-Regular.ttf'); }
  :root { --bg1: #16213b; --bg2: #0b1120; --paper: #f4ecdc; --mark: #ffd23f; --hot: #ff6b4a; --ink: #0f172a; }
  html, body { background: var(--bg2); font-family: 'GM', sans-serif; }
  .stage { background: radial-gradient(ellipse at 30% 35%, var(--bg1), var(--bg2) 75%); }
  .grid { position: absolute; inset: -40px; opacity: .07;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 80px 80px; }
  .cap.sub { font-family: 'GMm', sans-serif; font-size: 46px; }

  /* 한 줄씩 아래에서 밀려 올라오기 */
  .line { position: absolute; overflow: hidden; padding: .08em .1em .02em; }
  .line > .in { display: inline-block; animation: lineIn .65s var(--t) both cubic-bezier(.16,1,.3,1); }
  @keyframes lineIn { from { transform: translateY(105%); } to { transform: none; } }

  /* 형광펜: 바탕이 왼쪽에서 오른쪽으로 칠해지고 글자색이 바뀐다 */
  .mk { color: var(--paper); padding: 0 .12em; border-radius: .08em;
    background: linear-gradient(var(--mark), var(--mark)) no-repeat 0 60% / 0% 78%;
    animation: mk .6s var(--t) both cubic-bezier(.65,0,.25,1); }
  @keyframes mk { to { background-size: 100% 78%; color: var(--ink); } }
  .mk.hot { --mark: var(--hot); }
  @keyframes mkHot { to { background-size: 100% 78%; color: #fff; } }
  .mk.hot { animation-name: mkHot; }

  .kick { font-family: 'GMm', sans-serif; font-size: 50px; color: rgba(244,236,220,.7); letter-spacing: .04em; }
  .big { font-family: 'BH', sans-serif; color: var(--paper); line-height: 1; letter-spacing: -.01em; }
  .tag { font-size: 96px; }
  .rule { position: absolute; height: 6px; background: var(--mark); transform-origin: left; animation: rule .7s var(--t) both cubic-bezier(.65,0,.25,1); }
  @keyframes rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .exit.out { animation: gone .45s var(--u) forwards ease-in; }
  .vs { position: absolute; left: 948px; top: 250px; width: 4px; height: 470px; background: rgba(244,236,220,.25); transform-origin: top; animation: vs .6s var(--t) both ease-out; }
  @keyframes vs { from { transform: scaleY(0); } to { transform: scaleY(1); } }
</style>
</head>
<body data-bg="none">
<div class="stage">
  <div class="grid"></div>
  <div class="cam">

    <!-- 1번 자막: 커피 5,000원 (왼쪽) — 2번에서 흐려지고 3번에서 빠진다 -->
    <div class="abs exit" data-until="3" style="inset:0">
      <div class="dim-wrap" style="position:absolute; inset:0">
        <div class="line kick" style="left:170px; top:250px"><span class="in" data-at="+0.05">커피 한 잔</span></div>
        <div class="rule" data-at="1:오천" data-off="-0.2" style="left:176px; top:326px; width:140px"></div>
        <div class="line big" style="left:160px; top:350px; font-size:230px"><span class="in" data-at="1:오천" data-off="-0.1"><span class="num" data-to="5000" data-fmt="comma" data-at="1:오천" data-dur="1.1">0</span>원</span></div>
        <div class="line tag" style="left:170px; top:620px"><span class="in" data-at="1:아까워하면서" data-off="-0.25"><span class="mk" data-at="1:아까워하면서" data-off="0.05">아깝다</span></span></div>
      </div>
    </div>

    <div class="abs exit" data-until="3" style="inset:0"><div class="vs" data-at="2"></div></div>

    <!-- 2번 자막: 쇼핑 수십만 원 (오른쪽) -->
    <div class="abs exit" data-until="3" style="inset:0">
      <div class="line kick" style="left:1030px; top:250px"><span class="in" data-at="2:쇼핑" data-off="-0.5">쇼핑 한 번</span></div>
      <div class="rule" data-at="2:수십만" style="left:1036px; top:326px; width:140px; background:var(--hot)"></div>
      <div class="big slam" data-at="2:수십만" style="position:absolute; left:1020px; top:360px; font-size:180px; color:var(--hot)">수십만 원</div>
      <div class="line tag" style="left:1030px; top:620px"><span class="in" data-at="2:쉽게" data-off="-0.2"><span class="mk hot" data-at="2:쉽게" data-off="0.1">쉽다</span></span></div>
    </div>

    <!-- 3번 자막: 오늘의 주제 (가운데, 한 줄씩) -->
    <div class="line kick" style="left:0; right:0; text-align:center; top:240px"><span class="in" data-at="3:오늘은">오늘의 주제</span></div>
    <div class="line big" style="left:0; right:0; text-align:center; top:330px; font-size:120px"><span class="in" data-at="3:마음속에">마음속에 숨은</span></div>
    <div class="line big" style="left:0; right:0; text-align:center; top:480px; font-size:210px"><span class="in" data-at="3:돈" data-off="-0.1"><span class="mk" data-at="3:계산법을">돈 계산법</span></span></div>

  </div>
</div>
<script src="_timing.js"></script><script src="../../../engine/web/kit.js"></script>
<script>
  // 2번 자막부터 왼쪽(커피)을 흐리게: 오른쪽으로 시선을 옮긴다
  const left = document.querySelector('.dim-wrap'), t2 = KIT.at('2:쇼핑') - 0.5;
  KIT.onFrame(t => { const k = KIT.ease((t - t2) / 0.5); left.style.opacity = 1 - 0.65 * k; left.style.filter = `blur(${3 * k}px)`; });
</script>
</body>
</html>
